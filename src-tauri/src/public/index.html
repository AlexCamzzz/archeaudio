<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcheAudio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Design tokens (override these in ~/.config/archeaudio/user_theme.css) -->
  <link rel="stylesheet" href="./styles/tokens.css">
  <!-- Base chrome: reset, body, scrollbar, header, tabs -->
  <link rel="stylesheet" href="./styles/base.css">
  <!-- Component styles: card, slider, buttons, VU, select -->
  <link rel="stylesheet" href="./styles/components.css">

  <!--
    Alpine component scripts — must load BEFORE Alpine.
    Each file calls document.addEventListener('alpine:init', …)
    so registration is guaranteed regardless of parse order.
  -->
  <script src="./js/themes.js"></script>
  <script src="./js/components/device-card.js"></script>
  <script src="./js/components/stream-card.js"></script>
  <script src="./js/app.js"></script>

  <!-- Alpine — deferred so it initialises after the DOM -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>

<body x-data="archeAudio">

<!-- ═══════════════════════════════════════════
     HEADER
═══════════════════════════════════════════ -->
<header>
  <div class="logo">
    <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <circle cx="14" cy="14" r="11" stroke="#00c8ff" stroke-width="1.2" opacity="0.3"/>
      <circle cx="14" cy="14" r="7"  stroke="#00c8ff" stroke-width="1.2" opacity="0.6"/>
      <circle cx="14" cy="14" r="2.5" fill="#00c8ff"/>
      <line x1="14" y1="3"  x2="14" y2="7"  stroke="#00c8ff" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="14" y1="21" x2="14" y2="25" stroke="#00c8ff" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="3"  y1="14" x2="7"  y2="14" stroke="#00c8ff" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="21" y1="14" x2="25" y2="14" stroke="#00c8ff" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="5.7"  y1="5.7"   x2="8.5"  y2="8.5"  stroke="#00c8ff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
      <line x1="19.5" y1="19.5" x2="22.3" y2="22.3" stroke="#00c8ff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    </svg>
    <span class="logo-bracket">[</span>
    ArcheAudio
    <span class="logo-bracket">]</span>
  </div>

  <div class="header-spacer"></div>

  <div class="status-pill">
    <div class="status-dot"></div>
    <span x-text="status"></span>
  </div>
</header>

<!-- ═══════════════════════════════════════════
     TAB BAR
═══════════════════════════════════════════ -->
<nav class="tabs" role="tablist">
  <template x-for="t in tabs" :key="t.id">
    <div class="tab"
         role="tab"
         :aria-selected="activeTab === t.id"
         :class="{ active: activeTab === t.id }"
         @click="activeTab = t.id"
         x-text="t.label">
    </div>
  </template>
</nav>

<!-- ═══════════════════════════════════════════
     CONTENT
═══════════════════════════════════════════ -->
<main class="content">

  <!-- ── PLAYBACK STREAMS ──────────────────────────────── -->
  <div class="tab-panel" x-show="activeTab === 'playback'" role="tabpanel">
    <template x-if="sinkInputs.length === 0">
      <div class="empty">no active playback streams</div>
    </template>

    <template x-for="s in sinkInputs" :key="s.id">
      <div class="card" :class="{ corked: s.corked }"
           x-data="streamCard(s, 'sink-input', sinks, sources, api)">
        <div class="card-stripe"></div>

        <div class="card-header">
          <div class="app-icon" x-text="appIcon(s.appName)"></div>

          <div class="card-title">
            <div class="card-name" x-text="s.appName"></div>
            <div class="card-sub"
                 x-show="s.mediaName && s.mediaName !== s.appName"
                 x-text="s.mediaName">
            </div>
          </div>

          <!-- VU meter (animated in JS) -->
          <div class="vu-wrap" :id="`vu-${s.id}`" aria-hidden="true">
            <template x-for="i in 10" :key="i">
              <div class="vu-bar" style="height:2px"></div>
            </template>
          </div>

          <div class="card-actions">
            <button class="btn" :class="{ muted: s.muted }"
                    @click="toggleMute()"
                    :aria-label="s.muted ? 'Unmute' : 'Mute'"
                    x-text="s.muted ? '󰝟 muted' : '󰕾 mute'">
            </button>
          </div>
        </div>

        <div class="vol-row">
          <div class="vol-label">vol</div>
          <div class="vol-slider" @mousedown="startDrag($event)"
               role="slider" :aria-valuenow="s.volume" aria-valuemin="0" aria-valuemax="150">
            <div class="vol-track"></div>
            <div class="vol-fill"
                 :style="`width:${volPct(s.volume)}%; background:${s.muted ? 'var(--text-dim)' : 'var(--accent)'}`">
            </div>
            <div class="vol-thumb" :style="`left:${volPct(s.volume)}%`"></div>
          </div>
          <div class="vol-value" x-text="s.volume + '%'"></div>
        </div>

        <div class="field-row">
          <div class="field-label">route</div>
          <select @change="route($event)" :aria-label="`Route ${s.appName} to output`">
            <template x-for="sk in targets" :key="sk.id">
              <option :value="sk.id"
                      :selected="matchesSink(sk)"
                      x-text="sk.name">
              </option>
            </template>
          </select>
        </div>
      </div>
    </template>
  </div>

  <!-- ── RECORDING STREAMS ─────────────────────────────── -->
  <div class="tab-panel" x-show="activeTab === 'recording'" role="tabpanel">
    <template x-if="sourceOutputs.length === 0">
      <div class="empty">no active recording streams</div>
    </template>

    <template x-for="s in sourceOutputs" :key="s.id">
      <div class="card" :class="{ corked: s.corked }"
           x-data="streamCard(s, 'source-output', sinks, sources, api)">
        <div class="card-stripe"></div>

        <div class="card-header">
          <div class="app-icon" x-text="appIcon(s.appName)"></div>

          <div class="card-title">
            <div class="card-name" x-text="s.appName"></div>
            <div class="card-sub"
                 x-show="s.mediaName && s.mediaName !== s.appName"
                 x-text="s.mediaName">
            </div>
          </div>

          <div class="card-actions">
            <button class="btn" :class="{ muted: s.muted }"
                    @click="toggleMute()"
                    x-text="s.muted ? '󰝟 muted' : '󰕾 mute'">
            </button>
          </div>
        </div>

        <div class="vol-row">
          <div class="vol-label">vol</div>
          <div class="vol-slider" @mousedown="startDrag($event)"
               role="slider" :aria-valuenow="s.volume" aria-valuemin="0" aria-valuemax="150">
            <div class="vol-track"></div>
            <div class="vol-fill"
                 :style="`width:${volPct(s.volume)}%; background:var(--accent)`">
            </div>
            <div class="vol-thumb" :style="`left:${volPct(s.volume)}%`"></div>
          </div>
          <div class="vol-value" x-text="s.volume + '%'"></div>
        </div>

        <div class="field-row">
          <div class="field-label">from</div>
          <select @change="route($event)">
            <template x-for="src in targets" :key="src.id">
              <option :value="src.id"
                      :selected="matchesSink(src)"
                      x-text="src.name">
              </option>
            </template>
          </select>
        </div>
      </div>
    </template>
  </div>

  <!-- ── OUTPUT DEVICES ────────────────────────────────── -->
  <div class="tab-panel" x-show="activeTab === 'output'" role="tabpanel">
    <template x-if="sinks.length === 0">
      <div class="empty">no output devices found</div>
    </template>

    <template x-for="s in sinks" :key="s.id">
      <div class="card" :class="{ 'is-default': s.isDefault }"
           x-data="deviceCard(s, 'sink', api)">
        <div class="card-stripe"></div>

        <div class="card-header">
          <div class="card-title">
            <div class="card-name" x-text="s.name"></div>
            <div class="card-sub"  x-text="s.nodeName"></div>
          </div>

          <div class="card-actions">
            <button x-show="!s.isDefault" class="btn set-def"
                    @click="makeDefault()">set default</button>
            <span   x-show="s.isDefault"  class="btn is-default-badge">● default</span>
            <button class="btn" :class="{ muted: s.muted }"
                    @click="toggleMute()"
                    x-text="s.muted ? '󰝟 muted' : '󰕾 mute'">
            </button>
          </div>
        </div>

        <div class="vol-row">
          <div class="vol-label">vol</div>
          <div class="vol-slider" @mousedown="startDrag($event)"
               role="slider" :aria-valuenow="s.volume" aria-valuemin="0" aria-valuemax="150">
            <div class="vol-track"></div>
            <div class="vol-fill" :style="`width:${volPct}%; background:${fillColor}`"></div>
            <div class="vol-thumb" :style="`left:${volPct}%`"></div>
          </div>
          <div class="vol-value"
               :style="s.isDefault ? 'color:var(--accent)' : ''"
               x-text="s.volume + '%'">
          </div>
        </div>

        <div class="field-row" x-show="hasPorts">
          <div class="field-label">port</div>
          <select @change="changePort($event)">
            <template x-for="p in s.ports" :key="p.name">
              <option :value="p.name"
                      :selected="p.name === s.activePort"
                      :disabled="!p.available"
                      x-text="p.description + (!p.available ? ' (n/a)' : '')">
              </option>
            </template>
          </select>
        </div>
      </div>
    </template>
  </div>

  <!-- ── INPUT DEVICES ─────────────────────────────────── -->
  <div class="tab-panel" x-show="activeTab === 'input'" role="tabpanel">
    <template x-if="sources.length === 0">
      <div class="empty">no input devices found</div>
    </template>

    <template x-for="s in sources" :key="s.id">
      <div class="card" :class="{ 'is-default': s.isDefault }"
           x-data="deviceCard(s, 'source', api)">
        <div class="card-stripe"></div>

        <div class="card-header">
          <div class="card-title">
            <div class="card-name" x-text="s.name"></div>
            <div class="card-sub"  x-text="s.nodeName"></div>
          </div>

          <div class="card-actions">
            <button x-show="!s.isDefault" class="btn set-def"
                    @click="makeDefault()">set default</button>
            <span   x-show="s.isDefault"  class="btn is-default-badge">● default</span>
            <button class="btn" :class="{ muted: s.muted }"
                    @click="toggleMute()"
                    x-text="s.muted ? '󰝟 muted' : '󰕾 mute'">
            </button>
          </div>
        </div>

        <div class="vol-row">
          <div class="vol-label">vol</div>
          <div class="vol-slider" @mousedown="startDrag($event)"
               role="slider" :aria-valuenow="s.volume" aria-valuemin="0" aria-valuemax="150">
            <div class="vol-track"></div>
            <div class="vol-fill" :style="`width:${volPct}%; background:${fillColor}`"></div>
            <div class="vol-thumb" :style="`left:${volPct}%`"></div>
          </div>
          <div class="vol-value"
               :style="s.isDefault ? 'color:var(--accent)' : ''"
               x-text="s.volume + '%'">
          </div>
        </div>

        <div class="field-row" x-show="hasPorts">
          <div class="field-label">port</div>
          <select @change="changePort($event)">
            <template x-for="p in s.ports" :key="p.name">
              <option :value="p.name"
                      :selected="p.name === s.activePort"
                      x-text="p.description">
              </option>
            </template>
          </select>
        </div>
      </div>
    </template>
  </div>

  <!-- ── CONFIG / CARD PROFILES ────────────────────────── -->
  <div class="tab-panel" x-show="activeTab === 'config'" role="tabpanel">

    <!-- Theme picker -->
    <div class="cfg-card">
      <div class="cfg-card-head">
        <div>
          <div class="cfg-card-label">appearance</div>
          <div class="cfg-card-title">Theme</div>
        </div>
      </div>
      <div class="cfg-card-body">

        <div class="theme-grid">
          <template x-for="t in themeList" :key="t.id">
            <div class="theme-card"
                 :class="{ active: activeTheme === t.id }"
                 @click="setTheme(t.id)"
                 :title="t.label">
              <div class="theme-swatch" :style="`background: ${t.swatch}`"></div>
              <div class="theme-preview">
                <div class="theme-dot" :style="`background: ${t.vars['bg']}`"></div>
                <div class="theme-dot" :style="`background: ${t.vars['surface2']}`"></div>
                <div class="theme-dot" :style="`background: ${t.vars['accent']}`"></div>
                <div class="theme-dot" :style="`background: ${t.vars['green']}`"></div>
                <div class="theme-dot" :style="`background: ${t.vars['red']}`"></div>
              </div>
              <div class="theme-label" x-text="t.label"></div>
            </div>
          </template>
        </div>

        <div class="user-theme-note">
          Drop a <code>user_theme.css</code> at
          <code>~/.config/archeaudio/user_theme.css</code>
          to override any variable on top of the active theme.
        </div>

      </div>
    </div>

    <!-- Hardware card profiles -->
    <template x-if="cards.length > 0">
      <div>
        <div class="section-divider">hardware</div>
        <template x-for="c in cards" :key="c.id">
          <div class="cfg-card">
            <div class="cfg-card-head">
              <div>
                <div class="cfg-card-label">audio card</div>
                <div class="cfg-card-title" x-text="c.description"></div>
                <div class="card-sub" style="margin-top:3px" x-text="c.name"></div>
              </div>
            </div>
            <div class="cfg-card-body">
              <div class="field-row">
                <div class="field-label">profile</div>
                <select @change="setProfile(c.name, $event.target.value)">
                  <template x-for="p in c.profiles" :key="p.name">
                    <option :value="p.name"
                            :selected="p.name === c.activeProfile"
                            :disabled="!p.available"
                            x-text="p.description + (!p.available ? ' (n/a)' : '')">
                    </option>
                  </template>
                </select>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

  </div>

</main>

<!-- ═══════════════════════════════════════════
     TOAST
═══════════════════════════════════════════ -->
<div class="toast"
     x-show="toastMsg"
     x-text="toastMsg"
     x-transition
     x-cloak
     role="status"
     aria-live="polite">
</div>

</body>
</html>
